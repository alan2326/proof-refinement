name      = "compute_phi_taylor (Step 3)"
slug      = "compute_phi_taylor"
kind      = "computational"
paper_ref = "Braverman §5 numerics; φ Taylor coefficients"

parents = ["eval_h_eta_at_i"]

[python]
module   = "proof_graph.oracle_wrappers"
function = "compute_phi_taylor_pipeline"

[python.inputs]
b_series_path = { source = "const:b_series_path", cast = "str" }
