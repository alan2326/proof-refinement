[[oracles]]
axiom = "hEq15_oracle_certified_hp_3564"
bound_field = "eq15_lower_bound"
oracle_fn = "rigorous_scalar.certify_eq15_at_hp_3564"

# Sprint 059: fourth c-push oracle. Pins `certify_eq15` at
