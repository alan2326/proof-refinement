# `certify_two_window_mass_at_35646` — the joint two-window τ-partition
# kernel mass wrapper — at
#   (c_num, c_den)             = (35646, 100000)
#   (rs1_num, rs1_den)         = (378083, 1000000)     # ρ_start_1
#   (rt1_num, rt1_den)         = (411605, 1000000)     # ρ_stop_1 = ρ_start_2
#   (rt2_num, rt2_den)         = (999999, 1000000)     # ρ_stop_2
#   (j_1, j_2)                 = (2, 1)
#   (dps, n_trunc)             = (30, 200).
# The wrapper computes
#   total := ∫_{ρ_start_1..ρ_stop_1} 2ρ / (H_2(c, ρ) · Λ(c, ρ)) dρ
#         + ∫_{ρ_stop_1..ρ_stop_2}   2ρ / (H_1(c, ρ) · Λ(c, ρ)) dρ
# via mp.quad and returns ``Fraction(1, 1)`` iff
#   total ≥ 1 + 10^(-min(dps, 30))
# (matching the existing `certify_eq15` strict-margin pattern). The
# Phase 0 witness (sprint 078) and endpoint-pinned re-verification
# (sprint 079) both record margin ≥ 1e-3, so the wrapper's certification
# margin at the registered envelope is ~27 orders of magnitude above the
# strict-margin floor.
#
# Falsifiability: the joint mass crosses below 1 around c ≈ 0.35654
# per sprint 078's Phase 0 sweep; a wrapper that returned True at
# c ≥ 0.35655 would not be verifying anything. The chosen
# c = 35646/100000 is sprint 078's reported witness above V60.
#
# This is the workspace's first NON-eq15 oracle. The candidate-side
# axiom `h_two_window_mass_certified_at_35646` is shaped to match the
# `hMassTotal` field of the new closing reducer
# `valid_of_perMode_twoWindow_tau_partition_eq8_eq9` (sprint 078,
# `Proof/Reduction.lean`).

[[oracles]]
axiom = "h_two_window_mass_certified_at_35646"
bound_field = "two_window_mass_lower"
oracle_fn = "rigorous_scalar.certify_two_window_mass_at_35646"

