# Sprint 053: first registered numerical oracle.
#
# The schema fields below match `Evaluator.py:load_workspace_config`'s
# actual reader (`axiom`, `bound_field`, `oracle_fn`). The Evaluator
# invokes `oracle_fn` with no arguments and expects a Fraction-coercible
# numeric lower bound that it then compares to the candidate-side
# `def <bound_field> : ℝ := ...` via `oracle_bound <= declared`.
#
# `eq15_certified_at_seed` pins `Numerical_Library.rigorous_scalar.certify_eq15`
# at the bulletin-prescribed seed envelope `(c_num, c_den, dps, n_trunc) =
# (3554, 10000, 50, 200)` via the zero-argument shim
# `certify_eq15_at_seed`. The shim returns `Fraction(1)` iff `certify_eq15`
# accepts the seed under the registered envelope (sprint 050's mpmath
# `dps=50, N_TRUNC=200` reverification reports gap +2.55e-02 at the seed,
# well above the strict-margin threshold `10^(-30)`); on rejection the
# shim raises so the Evaluator records an oracle-check failure rather than
# silently accepting an unverified `hEq15_oracle_certified_3554`.
#
# Falsifiability: the wrapper rejects `(3565, 10000, dps=50, n_trunc=200)`
# (gap -3.598e-04 per sprint 050's crossover-pinpoint), so re-pointing the
# wrapper at a `c` past the literal `(15)` crossover refuses certification.

[[oracles]]
axiom = "hEq15_oracle_certified_3554"
bound_field = "eq15_lower_bound"
oracle_fn = "rigorous_scalar.certify_eq15_at_seed"

# Sprint 055: first c-push oracle. Pins `certify_eq15` at
# `(c_num, c_den, dps, n_trunc) = (1780, 5000, 50, 200)` via the
# zero-argument shim `certify_eq15_at_3560`. Per sprint 050's mpmath
# `dps=50, N_TRUNC=200` table, gap = +1.131e-02 at c = 0.3560
# (well above the wrapper's ~0.003 box-by-box conservatism gap
# relative to adaptive `mp.quad`, and ~10^28 times the strict-margin
# threshold `10^(-30)`).
#
# Falsifiability: the wrapper rejects `(3565, 10000, dps=50, n_trunc=200)`
# (gap -3.598e-04 per sprint 050's crossover-pinpoint). The same wrapper
# at `(1780, 5000)` is structurally on the safe side of that crossover.

[[oracles]]
axiom = "hEq15_oracle_certified_3560"
bound_field = "eq15_lower_bound"
oracle_fn = "rigorous_scalar.certify_eq15_at_3560"

# Sprint 056: second c-push oracle. Pins `certify_eq15` at
# `(c_num, c_den, dps, n_trunc) = (1781, 5000, 50, 200)` via the
# zero-argument shim `certify_eq15_at_3562`. The wrapper's positive return
# at this `(c_num, c_den)` is pre-verified by
# `Scratch/sprint_056_eq15_wrapper_pre_verification.py` (certified
# total_mass_lower 1.003960506, margin +3.96e-03 above the threshold).

[[oracles]]
axiom = "hEq15_oracle_certified_3562"
bound_field = "eq15_lower_bound"
oracle_fn = "rigorous_scalar.certify_eq15_at_3562"

# Sprint 057: third c-push oracle. Pins `certify_eq15` at
# `(c_num, c_den, dps, n_trunc) = (1782, 5000, 100, 500)` via the
# zero-argument shim `certify_eq15_at_hp_3564`. First workspace oracle
# with non-default precision envelope: standard `(dps=50, n_trunc=200)`
