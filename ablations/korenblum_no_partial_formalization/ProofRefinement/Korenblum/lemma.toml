name = "Korenblum Constant (noPF)"
slug = "korenblum_noPF"
paper_ref = "Korenblum max principle, Bergman A² level; Wang (2025) at c=0.3554"

sink_theorem = "korenblum_constant_search"
constant_def = "c_value"
score = "c_value"
score_direction = "maximize"

[search_constants]

[import_policy]
# Candidate-side strict surface enforced by Evaluator.py against
# Candidates/V<N>.lean. No KorenblumPaper.* — the partial formalization
# is removed in this arm. New per-candidate derived-theorem modules under
# ProofRefinement.Korenblum.Proof are admitted via allowed_prefixes.
allowed_exact = []
allowed_prefixes = [
  "ProofRefinement.Korenblum.Proof",
  "Mathlib",
]

[workspace_import_policy]
# Workspace-level surface. Strict — no KorenblumPaper.* anywhere.
allowed_exact = []
allowed_prefixes = [
  "ProofRefinement.Korenblum",
  "Mathlib",
]

[seed_axioms]
allowed = [
  "propext",
  "Classical.choice",
  "Quot.sound",
  "Lean.ofReduceBool",
  "Lean.trustCompiler",

  # Wang (2025) result, axiomatized at the Bergman A² level. The single
  # paper-side leaf in this ablation arm. Asserts the FULL conclusion of
  # the Korenblum max principle at c = 0.3554, not a sub-claim.
  "hKorenblum_published_3554",
]

# No oracles. The Bergman-level contract has no natural numerical sub-claim
# in this workspace. If the agent introduces a partial formalization of its
# own and exposes a numerical sub-claim, the corresponding [[oracles]] entry
# would go here, with a wrapper in a (newly created) Numerical_Library.
